name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon

      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk dnd-dice.apk

      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dnd-dice.apk \
            --title "Кости — последняя сборка" \
            --notes "Скачай dnd-dice.apk ниже и установи на телефон."
